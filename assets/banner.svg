<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0015"/>
      <stop offset="45%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0d0d2b"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="25%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="75%" stop-color="#6366f1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0);    }
      }
      @keyframes expandLine {
        from { stroke-dashoffset: 800; }
        to   { stroke-dashoffset: 0;   }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; r: 130px; }
        50%       { opacity: 0.30; r: 145px; }
      }
      @keyframes pulse2 {
        0%, 100% { opacity: 0.10; r: 100px; }
        50%       { opacity: 0.22; r: 112px; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0; }
      }
      @keyframes drift {
        0%   { transform: translate(0px, 0px);    opacity: 0.5; }
        33%  { transform: translate(4px, -6px);   opacity: 0.8; }
        66%  { transform: translate(-3px, -3px);  opacity: 0.4; }
        100% { transform: translate(0px, 0px);    opacity: 0.5; }
      }
      .title    { animation: fadeUp 0.9s cubic-bezier(.16,1,.3,1) 0.2s both; }
      .subtitle { animation: fadeUp 0.9s cubic-bezier(.16,1,.3,1) 0.6s both; }
      .tagline  { animation: fadeUp 0.9s cubic-bezier(.16,1,.3,1) 1.0s both; }
      .tags     { animation: fadeUp 0.9s cubic-bezier(.16,1,.3,1) 1.3s both; }
      .divline  { stroke-dasharray: 800; animation: expandLine 1.8s ease 0.8s both; }
      .orb1     { animation: pulse  4s ease-in-out infinite; }
      .orb2     { animation: pulse2 5s ease-in-out infinite 1.5s; }
      .d1  { animation: drift 6s ease-in-out infinite;       }
      .d2  { animation: drift 7s ease-in-out infinite  1.2s; }
      .d3  { animation: drift 5s ease-in-out infinite  2.4s; }
      .d4  { animation: drift 8s ease-in-out infinite  0.8s; }
      .d5  { animation: drift 6s ease-in-out infinite  3.1s; }
      .d6  { animation: drift 7s ease-in-out infinite  1.7s; }
      .cursor { animation: blink 1s step-end infinite 1.8s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg)"/>

  <!-- Ambient orbs -->
  <circle cx="720" cy="80"  r="130" fill="url(#glow1)" class="orb1"/>
  <circle cx="160" cy="210" r="100" fill="url(#glow2)" class="orb2"/>
  <circle cx="450" cy="140" r="180" fill="#1a0533" fill-opacity="0.4"/>

  <!-- Floating particles -->
  <circle class="d1" cx="60"  cy="55"  r="2"   fill="#a78bfa" fill-opacity="0.7"/>
  <circle class="d2" cx="140" cy="25"  r="1.5" fill="#c4b5fd" fill-opacity="0.5"/>
  <circle class="d3" cx="830" cy="240" r="2"   fill="#818cf8" fill-opacity="0.6"/>
  <circle class="d4" cx="860" cy="130" r="1.5" fill="#a78bfa" fill-opacity="0.5"/>
  <circle class="d5" cx="40"  cy="220" r="1.5" fill="#c4b5fd" fill-opacity="0.4"/>
  <circle class="d6" cx="790" cy="50"  r="2"   fill="#818cf8" fill-opacity="0.5"/>
  <circle class="d1" cx="500" cy="30"  r="1"   fill="#a78bfa" fill-opacity="0.4"/>
  <circle class="d3" cx="280" cy="260" r="1.5" fill="#818cf8" fill-opacity="0.4"/>
  <circle class="d5" cx="680" cy="265" r="1"   fill="#c4b5fd" fill-opacity="0.35"/>

  <!-- Decorative grid lines (subtle) -->
  <line x1="0" y1="70"  x2="900" y2="70"  stroke="#a78bfa" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="210" x2="900" y2="210" stroke="#a78bfa" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="280" stroke="#a78bfa" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="280" stroke="#a78bfa" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Main title -->
  <text x="450" y="115"
        font-family="Arial,Helvetica,sans-serif"
        font-size="56" font-weight="700"
        fill="url(#titleGrad)"
        text-anchor="middle"
        letter-spacing="3"
        filter="url(#textglow)"
        class="title">Ishtarth Umesh</text>

  <!-- Animated underline -->
  <line x1="180" y1="130" x2="720" y2="130"
        stroke="url(#lineGrad)" stroke-width="1.5" class="divline"/>

  <!-- Role line -->
  <text x="450" y="163"
        font-family="Arial,Helvetica,sans-serif"
        font-size="15" font-weight="400"
        fill="#c4b5fd" text-anchor="middle" letter-spacing="1.5"
        class="subtitle">BUSINESS &amp; PRODUCT ANALYST</text>

  <!-- Tag pills via text -->
  <text x="450" y="195"
        font-family="Arial,Helvetica,sans-serif"
        font-size="12" fill="#8b83c4" text-anchor="middle" letter-spacing="0.5"
        class="tagline">Ex-KPMG Big 4  ·  Tufts MEM '27  ·  Boston, MA  ·  $1M+ Impact</text>

  <!-- Italic quote -->
  <text x="450" y="224"
        font-family="Georgia,serif"
        font-size="12" fill="#6b5fa8" text-anchor="middle"
        font-style="italic"
        class="tags">"I don't make dashboards — I answer questions with data."</text>

  <!-- Bottom wave path -->
  <path d="M0 265 Q225 245 450 258 Q675 271 900 255 L900 280 L0 280 Z"
        fill="#0a0015" fill-opacity="0.6"/>
</svg>
